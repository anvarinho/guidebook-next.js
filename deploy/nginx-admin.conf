# REVIEW ONLY: include inside the existing central-asia.live HTTPS server block.
# Keep the existing /api backend location and /uploads location unchanged.
location ^~ /api/auth/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Overwrite, never append. Configure ADMIN_TRUSTED_IP_HEADER=x-admin-client-ip
    # only after the Next.js listening port is inaccessible to untrusted clients.
    proxy_set_header X-Admin-Client-IP $remote_addr;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    client_max_body_size 16k;
}
