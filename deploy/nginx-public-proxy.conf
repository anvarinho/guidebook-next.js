# Include once inside the canonical HTTPS server, replacing its location /.
# Existing /api, /uploads, /health and authentication locations stay in place.
location / {
    include /etc/nginx/snippets/guidebook-content-slug-guard.conf;
    limit_req zone=guidebook_crawlers burst=3 nodelay;
    limit_req zone=guidebook_search burst=10 nodelay;
    limit_req zone=guidebook_pages burst=20 nodelay;
    limit_req zone=guidebook_sitemaps burst=4 nodelay;
    limit_req_status 429;
    limit_conn guidebook_page_connections 16;
    limit_conn guidebook_render_connections 24;
    limit_conn guidebook_sitemap_connections 1;
    limit_conn_status 429;
    error_page 429 = @guidebook_rate_limited;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $guidebook_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    # Edge cache: anonymous GET/HEAD 200 pages for 60 s, then serve stale while one
    # request refreshes in the background (matches Next's s-maxage=60).
    proxy_cache guidebook_edge;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_valid 200 60s;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_bypass $guidebook_skip_cache;
    proxy_no_cache $guidebook_skip_cache;
    add_header X-Edge-Cache $upstream_cache_status always;
}

location = /_next/image {
    limit_req zone=guidebook_images burst=80 nodelay;
    limit_req_status 429;
    error_page 429 = @guidebook_rate_limited;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    # Edge cache: optimized images are identical per URL + Accept (webp). Keep them a
    # week and let browsers reuse them without revalidating on every view.
    proxy_cache guidebook_edge;
    proxy_cache_key $scheme$host$request_uri$http_accept;
    proxy_cache_valid 200 7d;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header Vary Accept always;
    add_header X-Edge-Cache $upstream_cache_status always;
}

location @guidebook_rate_limited {
    add_header Retry-After 5 always;
    default_type text/plain;
    return 429 "Too many requests. Please try again shortly.\n";
}
