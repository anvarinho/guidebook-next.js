# Include once inside the canonical HTTPS server, replacing its location /.
# Existing /api, /uploads, /health and authentication locations stay in place.
location / {
    include /etc/nginx/snippets/guidebook-content-slug-guard.conf;
    limit_req zone=guidebook_crawlers burst=3 nodelay;
    limit_req zone=guidebook_search burst=10 nodelay;
    limit_req zone=guidebook_pages burst=20 nodelay;
    limit_req zone=guidebook_sitemaps burst=4 nodelay;
    limit_req_status 429;
    limit_conn guidebook_page_connections 16;
    limit_conn guidebook_render_connections 24;
    limit_conn guidebook_sitemap_connections 1;
    limit_conn_status 429;
    error_page 429 = @guidebook_rate_limited;
    proxy_pass http://guidebook_frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $guidebook_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Ask Next for identity encoding: nginx compresses (brotli/gzip) per client and the cache stays encoding-neutral.
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    # Edge cache: anonymous 200 pages for 60 s, stale while one request refreshes.
    proxy_cache guidebook_edge;
    # One entry per URL, not per Accept-Encoding string (Vary would store a copy for each browser variant
    # and serve the pre-deploy copy to the first visitor of each). nginx compresses per client; the
    # Next RSC request headers stay in the key so client-navigation payloads never replace HTML.
    proxy_ignore_headers Vary;
    proxy_cache_key $scheme$host$request_uri$http_rsc$http_next_router_state_tree$http_next_router_prefetch$http_next_router_segment_prefetch;
    proxy_cache_valid 200 60s;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_bypass $guidebook_skip_cache;
    proxy_no_cache $guidebook_skip_cache;
    include /etc/nginx/snippets/guidebook-security-headers.conf;
    add_header X-Edge-Request-ID $request_id always;
    add_header X-Edge-Cache $upstream_cache_status always;
}

# Real-user beacons. A separate location so they never spend the page budget above, and so
# anything that is not a same-origin POST with a tiny body is refused before it reaches the app
# (those 403/405/413 are logged, and counted as rejected in the statistics). A 429 carries
# Retry-After: the page retries it once with the same beacon ids.
location = /rum {
    limit_except POST { deny all; }
    if ($http_sec_fetch_site ~ "^(?:cross-site|same-site)$") { return 403; }
    client_max_body_size 1k;
    limit_req zone=guidebook_rum burst=20 nodelay;
    limit_req zone=guidebook_rum_bots burst=3 nodelay;
    limit_req_status 429;
    error_page 429 = @guidebook_rate_limited;
    proxy_pass http://guidebook_frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

location = /_next/image {
    limit_req zone=guidebook_images burst=80 nodelay;
    limit_req_status 429;
    error_page 429 = @guidebook_rate_limited;
    proxy_pass http://guidebook_frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    # Edge cache: optimized images by URL + Accept, kept 7 days.
    proxy_cache guidebook_edge;
    proxy_ignore_headers Vary;
    proxy_cache_key $scheme$host$request_uri$guidebook_image_format;
    proxy_cache_valid 200 7d;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Cache-Control;
    include /etc/nginx/snippets/guidebook-security-headers.conf;
    add_header X-Edge-Request-ID $request_id always;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header Vary Accept always;
    add_header X-Edge-Cache $upstream_cache_status always;
}

location @guidebook_rate_limited {
    include /etc/nginx/snippets/guidebook-security-headers.conf;
    add_header Retry-After 5 always;
    add_header X-Edge-Request-ID $request_id always;
    default_type text/plain;
    return 429 "Too many requests. Please try again shortly.\n";
}
