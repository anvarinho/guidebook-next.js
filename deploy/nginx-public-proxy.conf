# Include once inside the canonical HTTPS server, replacing its location /.
# Existing /api, /uploads, /health and authentication locations stay in place.
location / {
    limit_req zone=guidebook_crawlers burst=3 nodelay;
    limit_req zone=guidebook_search burst=10 nodelay;
    limit_req zone=guidebook_pages burst=20 nodelay;
    limit_req zone=guidebook_sitemaps burst=4 nodelay;
    limit_req_status 429;
    limit_conn guidebook_page_connections 16;
    limit_conn guidebook_render_connections 24;
    limit_conn guidebook_sitemap_connections 1;
    limit_conn_status 429;
    error_page 429 = @guidebook_rate_limited;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $guidebook_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
}

location = /_next/image {
    limit_req zone=guidebook_images burst=80 nodelay;
    limit_req_status 429;
    error_page 429 = @guidebook_rate_limited;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
}

location @guidebook_rate_limited {
    add_header Retry-After 5 always;
    default_type text/plain;
    return 429 "Too many requests. Please try again shortly.\n";
}
