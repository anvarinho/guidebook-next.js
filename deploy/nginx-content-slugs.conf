# Install in conf.d/ (http context), then include the accompanying snippet
# inside the canonical public server's location / before proxy_pass.
# $uri is Nginx's normalized, percent-decoded path; query strings are excluded.
# Recover booking messages appended to known tour URLs. Capture only a known
# canonical slug and locale; never forward the untrusted suffix or query string.
# Update this tour allowlist when published tour slugs change.
map $uri $guidebook_booking_redirect {
    default "";
    "~^/(?<guidebook_booking_locale>[a-z]{2}|fil)/tours/(?<guidebook_booking_slug>ala-archa-national-park-a-day-hike-trip|bishkek-car-rental|chunkurchak-valley-hiking|chuy-region-highlights-tour|chuy-ysyk-kol-highlights-tour|grand-tour-kyrgyzstan|grand-tour-south-kyrgyzstan|kyrgyzstan-highlights-tour|manas-airport-transfers|sightseeing-tour-of-bishkek|trekking-and-horse-riding-tour)(?: |%(?:25)*20).+$" "https://wa.me/996500490806?text=I%20would%20like%20to%20book%20this%20tour%3A%0Ahttps%3A%2F%2Fcentral-asia.live%2F$guidebook_booking_locale%2Ftours%2F$guidebook_booking_slug";
}

map $uri $guidebook_invalid_content_slug {
    default 0;
    "~^/(?:[a-z]{2}|fil)/(?:places|tours|articles)/(?=[^/]{1,200}/?$)[a-z0-9]+(?:-[a-z0-9]+)*/?$" 0;
    "~^/(?:[a-z]{2}|fil)/(?:places|tours|articles)/." 1;
}
