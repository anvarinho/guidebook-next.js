# Install in conf.d/ (http context). Replace the old global access_log directive
# with this one; guidebook-health.py accepts both historical and JSON records.
# Analytics fields added 2026-11-11 (country, visitor id, fetch metadata, referer, utm);
# beacon ids, navigation type, TTFB, LCP element type and error hash added 2026-11-17.

# Country lookup: DB-IP Lite (CC-BY 4.0, https://db-ip.com), refreshed by
# /etc/cron.monthly/guidebook-geoip-update.
geoip2 /var/lib/GeoIP/dbip-country-lite.mmdb {
    auto_reload 24h;
    $geoip2_country_code default=XX country iso_code;
}

# Logging-only classification (rate limits use guidebook-resource-limits.conf).
map $http_user_agent $guidebook_traffic_class {
    default browser_or_other;
    ""      claimed_crawler;
    ~*(?:bot|crawl|spider|slurp|headless|externalagent|webindexer|externalhit|preview|curl|wget|python|go-http|okhttp|java/|axios|node-fetch|scrapy|httpclient|libwww|lighthouse|pingdom|uptime|monitor) claimed_crawler;
}
map "$http_next_router_prefetch:$http_purpose:$http_sec_purpose" $guidebook_prefetch {
    default false;
    ~*prefetch true;
    ~^1: true;
}

# Internal (team) traffic: known IPs, or a browser that visited /__gb-internal once.
geo $guidebook_internal_ip {
    default 0;
    139.28.31.184/32 1;   # owner connection seen 2026-11-11 (dynamic ISP IP; the cookie is the reliable signal)
}
map "$guidebook_internal_ip:$cookie_gb_internal" $guidebook_internal {
    default true;
    "0:"    false;
}

# Traffic source sent by the real-user beacon (hostname only; anything else is dropped).
map $arg_ref $guidebook_ref {
    default "";
    "~^[a-z0-9.\-]{1,100}$" $arg_ref;
}

# Page named by the real-user beacon (a plain site path; anything else is dropped).
# The beacon's Referer header is not trusted for this: clients can strip or fake it.
map $arg_p $guidebook_page {
    default "";
    "~^/[A-Za-z0-9/_.\-]{0,200}$" $arg_p;
}

# Extra real-user beacon fields. Each is validated by pattern; anything else is logged as empty.
# Kept in step with src/lib/rum.ts in the frontend.
map $arg_e $guidebook_rum_event { default ""; "~^(?:v|l|g|x|wa|tel|mail|contact|lang|more|form)$" $arg_e; }
map $arg_d $guidebook_rum_device { default ""; "~^[mtd]$" $arg_d; }
map $arg_c $guidebook_rum_conn { default ""; "~^(?:4g|3g|2g|slow-2g)$" $arg_c; }
map $arg_n $guidebook_rum_new { default ""; "1" "1"; }
map $arg_s $guidebook_rum_session { default ""; "1" "1"; }
# vi names a view and q numbers the beacons within it: a retry repeats both, so reports count it once.
map $arg_vi $guidebook_rum_view { default ""; "~^[a-z0-9]{4,8}$" $arg_vi; }
map $arg_t $guidebook_rum_dwell { default ""; "~^[0-9]{1,4}$" $arg_t; }
map $arg_sd $guidebook_rum_scroll { default ""; "~^[0-9]{1,3}$" $arg_sd; }
map $arg_lcp $guidebook_rum_lcp { default ""; "~^[0-9]{1,6}$" $arg_lcp; }
map $arg_cls $guidebook_rum_cls { default ""; "~^[0-9]{1,5}$" $arg_cls; }
map $arg_inp $guidebook_rum_inp { default ""; "~^[0-9]{1,5}$" $arg_inp; }
map $arg_ttfb $guidebook_rum_ttfb { default ""; "~^[0-9]{1,5}$" $arg_ttfb; }
map $arg_lt $guidebook_rum_lcptype { default ""; "~^[it]$" $arg_lt; }
map $arg_nt $guidebook_rum_nav { default ""; "~^[nrbpsc]$" $arg_nt; }
map $arg_q $guidebook_rum_seq { default ""; "~^[0-9]{1,3}$" $arg_q; }
map $arg_eh $guidebook_rum_errhash { default ""; "~^[0-9a-f]{8}$" $arg_eh; }


log_format guidebook_json escape=json
    '{"timestamp":"$time_iso8601","server":"$server_name",'
    '"host":"$host","client_ip":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time","limit_req":"$limit_req_status",'
    '"limit_conn":"$limit_conn_status","request_id":"$request_id",'
    '"upstream_request_id":"$upstream_http_x_request_id",'
    '"traffic_class":"$guidebook_traffic_class","prefetch":$guidebook_prefetch,'
    '"country":"$geoip2_country_code","internal":$guidebook_internal,'
    '"vid_got":"$uid_got","vid_set":"$uid_set",'
    '"proto":"$server_protocol","tls":"$ssl_protocol",'
    '"accept_language":"$http_accept_language","accept_encoding":"$http_accept_encoding","referer":"$http_referer",'
    '"fetch_dest":"$http_sec_fetch_dest","fetch_mode":"$http_sec_fetch_mode",'
    '"fetch_site":"$http_sec_fetch_site","ch_mobile":"$http_sec_ch_ua_mobile",'
    '"ch_platform":"$http_sec_ch_ua_platform",'
    '"utm_source":"$arg_utm_source","utm_medium":"$arg_utm_medium","utm_campaign":"$arg_utm_campaign",'
    '"ref":"$guidebook_ref",'
    '"page":"$guidebook_page",'
    '"ev":"$guidebook_rum_event","dev":"$guidebook_rum_device","conn":"$guidebook_rum_conn",'
    '"new":"$guidebook_rum_new","sess":"$guidebook_rum_session","vi":"$guidebook_rum_view",'
    '"dwell":"$guidebook_rum_dwell","scroll":"$guidebook_rum_scroll",'
    '"lcp":"$guidebook_rum_lcp","cls":"$guidebook_rum_cls","inp":"$guidebook_rum_inp",'
    '"ttfb":"$guidebook_rum_ttfb","lt":"$guidebook_rum_lcptype","nt":"$guidebook_rum_nav",'
    '"q":"$guidebook_rum_seq","eh":"$guidebook_rum_errhash",'
    '"user_agent":"$http_user_agent"}';
access_log /var/log/nginx/access.log guidebook_json buffer=32k flush=1s;

# Monitoring is reachable only from the server's loopback interface.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    access_log off;
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
    location / { return 404; }
}
