# Install in /etc/nginx/conf.d/guidebook-resource-limits.conf (http context).
# Empty keys are not counted. Assets never spend the HTML-page budget.
map $uri $guidebook_is_page {
    default 1;
    ~^/_next/ 0;
    ~*\.(?:avif|css|gif|ico|jpe?g|js|json|map|mp4|png|svg|webm|webp|woff2?|xml|txt)$ 0;
}
map $http_user_agent $guidebook_crawler_id {
    default "";
    ~*(?:Googlebot|bingbot|BingPreview|DuckDuckBot|Applebot) "";
    ~*ClaudeBot claude;
    ~*meta-(?:webindexer|externalagent) meta;
    ~*SemrushBot semrush;
    ~*PerplexityBot perplexity;
    ~*GPTBot gpt;
    ~*Bytespider bytespider;
    ~*AhrefsBot ahrefs;
    ~*(?:bot|crawler|spider|slurp) $binary_remote_addr;
}
map $guidebook_is_page $guidebook_crawler_key {
    default "";
    1 $guidebook_crawler_id;
}
map $guidebook_is_page $guidebook_page_key {
    default "";
    1 $binary_remote_addr;
}
map $guidebook_is_page $guidebook_render_key {
    default "";
    1 render;
}
map $http_user_agent $guidebook_search_id {
    default "";
    ~*(?:Googlebot|bingbot|BingPreview|DuckDuckBot|Applebot) $binary_remote_addr;
}
map $guidebook_is_page $guidebook_search_key {
    default "";
    1 $guidebook_search_id;
}
map $http_upgrade $guidebook_connection {
    default upgrade;
    "" "";
}
map $uri $guidebook_sitemap_key {
    default "";
    /sitemap.xml sitemap;
    ~^/sitemaps/sitemap/ sitemap;
}
limit_req_zone $guidebook_crawler_key zone=guidebook_crawlers:1m rate=12r/m;
limit_req_zone $guidebook_search_key zone=guidebook_search:1m rate=60r/m;
limit_req_zone $guidebook_page_key zone=guidebook_pages:2m rate=5r/s;
limit_req_zone $binary_remote_addr zone=guidebook_images:1m rate=10r/s;
limit_req_zone $guidebook_sitemap_key zone=guidebook_sitemaps:1m rate=12r/m;
limit_conn_zone $guidebook_page_key zone=guidebook_page_connections:1m;
limit_conn_zone $guidebook_render_key zone=guidebook_render_connections:1m;
limit_conn_zone $guidebook_sitemap_key zone=guidebook_sitemap_connections:1m;

# Edge cache for public HTML and optimized images (http context).
# Create the directory first: install -d -o www-data -g www-data /var/cache/nginx/guidebook
proxy_cache_path /var/cache/nginx/guidebook levels=1:2 keys_zone=guidebook_edge:20m max_size=512m inactive=7d use_temp_path=off;
# Never serve cached HTML to signed-in/admin sessions or requests with credentials.
map "$http_authorization$http_cookie" $guidebook_skip_cache {
    default 1;
    "" 0;
}
