# Install in /etc/nginx/conf.d/guidebook-resource-limits.conf (http context).
# Empty keys are not counted. Assets never spend the HTML-page budget.
map $uri $guidebook_is_page {
    default 1;
    ~^/_next/ 0;
    ~*\.(?:avif|css|gif|ico|jpe?g|js|json|map|mp4|png|svg|webm|webp|woff2?|xml|txt)$ 0;
}
map $http_user_agent $guidebook_crawler_id {
    default "";
    ~*(?:Googlebot|bingbot|BingPreview|DuckDuckBot|Applebot) "";
    ~*ClaudeBot claude;
    ~*meta-(?:webindexer|externalagent) meta;
    ~*SemrushBot semrush;
    ~*PerplexityBot perplexity;
    ~*GPTBot gpt;
    ~*Bytespider bytespider;
    ~*AhrefsBot ahrefs;
    ~*(?:bot|crawler|spider|slurp) $binary_remote_addr;
}
map $guidebook_is_page $guidebook_crawler_key {
    default "";
    1 $guidebook_crawler_id;
}
map $guidebook_is_page $guidebook_page_key {
    default "";
    1 $binary_remote_addr;
}
map $guidebook_is_page $guidebook_render_key {
    default "";
    1 render;
}
map $http_user_agent $guidebook_search_id {
    default "";
    ~*(?:Googlebot|bingbot|BingPreview|DuckDuckBot|Applebot) $binary_remote_addr;
}
map $guidebook_is_page $guidebook_search_key {
    default "";
    1 $guidebook_search_id;
}
map $http_upgrade $guidebook_connection {
    default upgrade;
    "" "";
}
map $uri $guidebook_sitemap_key {
    default "";
    /sitemap.xml sitemap;
    ~^/sitemaps/sitemap/ sitemap;
}
# Real-user beacons (POST /rum) have their own budget, so a crawler burst can neither use up the
# page budget nor starve the beacons of real visitors. Clients that call themselves crawlers (the
# same user-agent words the log uses for traffic_class) share a tight limit per IP; everyone else
# gets room for a page's beacons (view, engaged, leave and a few clicks) per IP.
map $http_user_agent $guidebook_rum_bot_key {
    default "";
    "" $binary_remote_addr;
    ~*(?:bot|crawl|spider|slurp|headless|externalagent|webindexer|externalhit|preview|curl|wget|python|go-http|okhttp|java/|axios|node-fetch|scrapy|httpclient|libwww|lighthouse|pingdom|uptime|monitor) $binary_remote_addr;
}
map $http_user_agent $guidebook_rum_human_key {
    default $binary_remote_addr;
    "" "";
    ~*(?:bot|crawl|spider|slurp|headless|externalagent|webindexer|externalhit|preview|curl|wget|python|go-http|okhttp|java/|axios|node-fetch|scrapy|httpclient|libwww|lighthouse|pingdom|uptime|monitor) "";
}
limit_req_zone $guidebook_rum_human_key zone=guidebook_rum:2m rate=3r/s;
limit_req_zone $guidebook_rum_bot_key zone=guidebook_rum_bots:1m rate=6r/m;
limit_req_zone $guidebook_crawler_key zone=guidebook_crawlers:1m rate=12r/m;
limit_req_zone $guidebook_search_key zone=guidebook_search:1m rate=60r/m;
limit_req_zone $guidebook_page_key zone=guidebook_pages:2m rate=5r/s;
limit_req_zone $binary_remote_addr zone=guidebook_images:1m rate=10r/s;
limit_req_zone $guidebook_sitemap_key zone=guidebook_sitemaps:1m rate=12r/m;
limit_conn_zone $guidebook_page_key zone=guidebook_page_connections:1m;
limit_conn_zone $guidebook_render_key zone=guidebook_render_connections:1m;
limit_conn_zone $guidebook_sitemap_key zone=guidebook_sitemap_connections:1m;

# Edge cache for public HTML and optimized images (http context).
# Create the directory first: install -d -o www-data -g www-data /var/cache/nginx/guidebook
proxy_cache_path /var/cache/nginx/guidebook levels=1:2 keys_zone=guidebook_edge:20m max_size=1g inactive=7d use_temp_path=off;
# Never serve cached HTML to signed-in/admin sessions or requests with credentials.
# Only credentials and admin/login paths skip the cache. Analytics cookies (gb_vid, gb_internal,
# lang) do not change public HTML, so visitors who carry them must still get cached pages.
map $http_authorization $guidebook_skip_auth_header {
    default 1;
    "" 0;
}
map $http_cookie $guidebook_skip_session_cookie {
    default 0;
    "~*(?:^|[; ])(?:__Secure-|__Host-)?(?:next-auth|authjs)[.]" 1;
    "~*(?:^|[; ])(?:token|userID|isAdmin)=" 1;
}
map $uri $guidebook_skip_private_path {
    default 0;
    ~^/(?:admin|login)(?:/|$) 1;
}
map "$guidebook_skip_auth_header$guidebook_skip_session_cookie$guidebook_skip_private_path" $guidebook_skip_cache {
    default 1;
    "000" 0;
}

# /_next/image output depends only on whether the client accepts WebP (next.config images.formats).
# Keying the edge cache on the full Accept header made every browser/version cold separately.
map $http_accept $guidebook_image_format {
    default original;
    "~*image/webp" webp;
}
